<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090708">
  <title>The Velvet Vesper</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="menuButton" aria-label="Open library">☰</button>
      <div class="brand"><span>THE VELVET</span><strong>VESPER</strong><small>PRIVATE STORY ENGINE</small></div>
      <button class="icon-button" id="settingsButton" aria-label="Settings">⚙</button>
    </header>

    <main class="workspace">
      <section class="empty-state" id="emptyState">
        <div class="sigil">V</div>
        <h1>Your stories belong here.</h1>
        <p>Import a Noctis vault or begin a new Vesper story.</p>
        <div class="action-row">
          <button class="primary" id="importButton">Import Noctis</button>
          <button class="secondary" id="newStoryButton">New Story</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <div id="importPreview" class="preview" hidden></div>
      </section>

      <section class="chat-view" id="chatView" hidden>
        <div class="storybar">
          <div><small>ACTIVE STORY</small><h2 id="storyTitle">Untitled</h2></div>
          <button class="pill" id="relationshipPill">Relationship</button>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="3" placeholder="Write your turn…"></textarea>
          <div class="composer-tools">
            <button type="button" class="ghost" id="oocButton">OOC</button>
            <button type="submit" class="send">Send</button>
          </div>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-tab="library">Library</button>
      <button data-tab="chat" class="active">Story</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="milestones">Milestones</button>
    </nav>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
