<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090708"><title>The Velvet Vesper</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles/app.css"></head><body>
<div id="app" class="app-shell"><header class="topbar"><button class="icon-button" id="menuButton">☰</button><div class="brand"><span>THE VELVET</span><strong>VESPER</strong><small>PRIVATE STORY ENGINE</small></div><button class="icon-button" id="settingsButton">⚙</button></header>
<main class="workspace"><section class="empty-state" id="emptyState"><div class="sigil">V</div><h1>Your stories belong here.</h1><p>Import a Noctis vault or begin a new Vesper story.</p><div class="action-row"><button class="primary" id="importButton">Import Noctis</button><button class="secondary" id="newStoryButton">New Story</button></div><input type="file" id="importFile" accept=".json,application/json" hidden><div id="importPreview" class="preview" hidden></div></section>
<section class="chat-view" id="chatView" hidden><div class="storybar"><div><small>ACTIVE STORY</small><h2 id="storyTitle">Untitled</h2></div><button class="pill" id="relationshipPill">Relationship</button></div><div class="messages" id="messages"></div><div id="status" class="status" hidden></div><form class="composer" id="composer"><textarea id="messageInput" rows="3" placeholder="Write your turn…"></textarea><div class="composer-tools"><button type="button" class="ghost" id="oocButton">OOC</button><button type="submit" class="send" id="sendButton">Send</button></div></form></section></main>
<nav class="bottom-nav"><button>Library</button><button class="active">Story</button><button>Memory</button><button>Milestones</button></nav></div>
<section class="modal-backdrop" id="settingsPanel" hidden><div class="settings-card"><div class="settings-head"><h2>Vesper Settings</h2><button class="icon-button" id="settingsClose">×</button></div><label>OpenRouter API key<input id="apiKey" type="password" autocomplete="off" placeholder="Stored only on this device"></label><label>OpenRouter model<input id="modelName" type="text" placeholder="e.g. provider/model-name"></label><p class="settings-note">Your key stays outside Vesper backups and is never committed to GitHub.</p><button class="primary" id="saveSettings">Save Settings</button></div></section>
<script type="module" src="./src/app.js"></script></body></html>
